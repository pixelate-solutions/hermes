services:
  postgres:
    image: postgres:16
    container_name: hermes-postgres
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: hermes-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: hermes-api
    env_file:
      - services/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/hermes
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/workspace/services/api
      - ./services/worker:/workspace/services/worker
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: hermes-worker
    command: ["python", "-m", "hermes_worker.worker"]
    env_file:
      - services/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/hermes
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
    volumes:
      - ./services/api:/workspace/services/api
      - ./services/worker:/workspace/services/worker
    depends_on:
      - postgres
      - redis
      - api

volumes:
  pg_data:
